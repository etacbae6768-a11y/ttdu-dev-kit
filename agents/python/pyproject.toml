[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ttdu-agent-tools"
version = "0.1.0"
description = "LlamaIndex and LangChain tools for the Tools That Don't Upload file flows and HWP/HWPX API."
readme = "README.md"
authors = [{ name = "Park Jihoon (Tools That Don't Upload)", email = "hello@toolsthatdontupload.com" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["toolsthatdontupload>=0.1.0"]

[project.optional-dependencies]
llamaindex = ["llama-index-core>=0.12"]
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://toolsthatdontupload.com/docs/sdk/"
Repository = "https://github.com/etacbae6768-a11y/ttdu-dev-kit"

[tool.hatch.build.targets.wheel]
packages = ["ttdu_agent_tools"]

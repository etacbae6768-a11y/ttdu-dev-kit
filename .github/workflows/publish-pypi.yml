name: publish-pypi
# PyPI Trusted Publishing (OIDC, no stored token). Pending publishers on pypi.org:
#   project toolsthatdontupload  and  ttdu-agent-tools  ->  owner etacbae6768-a11y, repo ttdu-dev-kit,
#   workflow publish-pypi.yml, environment pypi (toolsthatdontupload) / pypi-agents (ttdu-agent-tools)
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Folder to publish'
        required: true
        type: choice
        options: [sdk/python, agents/python]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build ${{ inputs.package }} --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.package == 'agents/python' && 'pypi-agents' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

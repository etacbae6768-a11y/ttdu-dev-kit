name: publish-npm
# npm Trusted Publishing (GitHub Actions OIDC, no stored token) with provenance.
# Each package must have this repository + workflow file registered as its trusted publisher on npmjs.com.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Folder to publish'
        required: true
        type: choice
        options: [sdk/typescript, cli, agents/js]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - name: Build the SDK (sdk/typescript only)
        if: inputs.package == 'sdk/typescript'
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund && npm run build
      - name: Publish
        working-directory: ${{ inputs.package }}
        run: npm publish --provenance --access public
